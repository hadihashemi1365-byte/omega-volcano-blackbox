name: OMEGA Volcano Black-Box Recorder (v2.0)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-volcano-blackbox
  cancel-in-progress: false

jobs:
  record-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record 15m Black-Box Snapshot (v2.0)
        run: python3 Volcano_Recorder.py

      - name: Commit & Push Daily CSV + Dashboard Manifest
        run: |
          git config user.name "omega-blackbox-bot"
          git config user.email "bot@omega-quant.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "blackbox v2.0: 15m snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
