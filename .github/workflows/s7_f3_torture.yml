name: OMEGA S7 F3 2-Year Torture Audit v1.0

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback Days (730 = 2 Full Years)"
        required: true
        default: "730"

jobs:
  f3-torture-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install --quiet requests

      - name: Run Offline Self-Test
        run: python3 S7_F3_TORTURE_AUDIT_v1_0.py --self-test

      - name: Run 2-Year F3 Torture & Ablation Audit
        run: |
          python3 S7_F3_TORTURE_AUDIT_v1_0.py \
            --days "${{ github.event.inputs.days || '730' }}" \
            --out "OMEGA_S7_F3_TORTURE_REPORT.txt"

      - name: Upload Torture Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: omega-s7-f3-torture-report
          path: OMEGA_S7_F3_TORTURE_REPORT.txt
          retention-days: 30
